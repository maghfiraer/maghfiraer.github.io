works:

- title: "Battery Storage and Natural Gas Generator Market Power"
  book: "Received Best Fourth Year Paper at Georgia Tech<br>Scheduled for presentation at SWEEEP@Georgia Tech 2026 and AEA/ASSA Annual Meeting 2027. Presented at Berkeley/Sloan Summer School in Energy and Environmental Economics 2025."
  note: "Draft coming soon"
  abstract: >
    Utility-scale batteries are often valued for their ability to integrate renewables. They also compete directly with the fossil generators that exercise market power when demand peaks, but the value of this competition has not been quantified. I study this competitive effect in Texas, where more than 7 GW of batteries entered after 2021. Using unit-level data on generator output, offers, costs, and local battery entry, I show that batteries make the residual demand of nearby gas generators more elastic, displace their evening output, and lower their evening markups. An additional  100 MWh of local storage reduces gas operating profits by 6 percent, and between 71 percent and all of this loss is market power rent. Gas generators keep setting prices, but at smaller margins. The resulting $47 million annual transfer flows mainly to consumers, while shifting energy across hours creates little value at marginal cost. Batteries earn their arbitrage revenue from the markups they erode, so competition limits the private return to storage.
