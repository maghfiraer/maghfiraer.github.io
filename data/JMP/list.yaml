works:

- title: "Battery Storage and Natural Gas Generator Market Power"
  pdflink: "https://maghfiraer.github.io/pdf/JMP_latest.pdf"
  book: "Received Best Fourth Year Paper at Georgia Tech<br>Scheduled for presentation at the AEA/ASSA Annual Meeting 2027. Presented at SWEEEP@Georgia Tech 2026 and Berkeley/Sloan Summer School in Energy and Environmental Economics 2025."
  abstract: >
    Battery storage is usually valued for integrating renewable energy, but it also competes directly with the natural gas generators that set prices and exercise market power during the evening, when electricity demand peaks. I study this competitive effect in Texas, exploiting the staggered expansion of storage capacity across counties. I find that storage lowers the evening markups of nearby gas generators. An additional 100 megawatt-hours of storage reduces gas operating profits by 6 percent, and at least 73 percent of this loss is market power rent. Gas generators keep setting prices, but at smaller margins. Storage also displaces evening gas output, especially from higher-cost generators. The resulting $47 million annual transfer flows mainly to consumers, while the production cost savings from shifting energy across hours are small.
