- title: "Digital Dispatch and Demand Response in Grid Emergencies: Evidence from Household Cooling in California's Flex Alerts"
  pdflink: "https://maghfiraer.github.io/pdf/flexalert_MR_DB_SA_Dec_2025.pdf"
  coauthors: "<a href='https://sorentanderson.com/' target='_blank'>Soren Anderson</a>, <a href='dylanbrewer.com' target='_blank'>Dylan Brewer</a>"
  book: "Received Best Third Year Paper and CRIDC Award at Georgia Tech<br>Presented at AEA/ASSA Annual Meeting 2026, AERE@SEA 2025, AERE Summer Conference 2025, AERE@MEA 2025, CRIDC@Georgia Tech 2025, EMEE 2025, CU Environmental and Resource Economics Workshop 2024​, SWEEEP@Georgia Tech 2024"
  abstract: >
    We study the interaction between moral suasion and automation in managing resource scarcity. Using data from smart thermostats during a California heatwave, we exploit a natural experiment involving voluntary conservation requests (Flex Alerts) and a statewide emergency phone alert. We document three findings. First, standard moral suasion suffers from rapid habituation. Second, high-salience signals (emergency alerts) reverse this habituation. Third, and most importantly, we identify a novel complementarity between salience and automation. High-salience alerts reduce the rate at which users override automated thermostat adjustments, tripling the efficacy of demand response technology. These results suggest that 'human frictions' limit the scalability of smart technologies, but crisis salience can mitigate these frictions.
  links:
    - url: "https://maghfiraer.github.io/pdf/flexalert_CRIDC_poster.pdf"
      text: "Poster (Presented at CRIDC@Georgia Tech 2025)"

- title: "Pollution, Avoidance Behavior, and Health"
  coauthors: "<a href='https://www.bobby-harris.com/' target='_blank'>Bobby Harris</a>"
  note: "Email for draft"
  book: "Scheduled for presentation at APPAM 2026. Presented at AERE@SEA 2025, ASHEcon 2025, Atlanta Economics PhD Student Symposium 2025, AERE Summer Conference 2025"
  abstract: >
    Avoiding air pollution may protect health while discouraging activities that improve health. We examine this tradeoff using millions of daily wearable observations linked to pollution data. Instrumenting pollution with wind direction, we find that pollution reduces physical activity, shortens sleep, and lowers running performance. Declines in activity are followed by next-day increases, suggesting that people partly adjust when they are active rather than simply forgoing activity. These findings reveal both the scope for adaptation through rescheduling and its limits: pollution affects participation in exercise, performance during exercise, and sleep, extending its economic consequences beyond conventional measures of illness and productivity.
  
